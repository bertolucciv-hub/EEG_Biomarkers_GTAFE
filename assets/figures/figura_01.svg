<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc"><title id="title">Figura 1. Arquitetura multimodal</title><desc id="desc">Do comportamento às hipóteses mecanísticas. Fluxograma esquemático em quatro etapas.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f9fbf8"/><stop offset="1" stop-color="#e8f2ed"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#153744" flood-opacity=".09"/></filter></defs><rect width="720" height="960" rx="25" fill="url(#bg)"/><path d="M0 0 H720 V15 H0Z" fill="#143a46"/><text x="42" y="56" font-size="17" letter-spacing="2.7" font-family="Arial,sans-serif" font-weight="700" fill="#146d66">EEG_BIOMARKERS  /  FIGURA 01</text><text x="42" y="116" font-size="33" font-weight="700" font-family="Georgia,serif" fill="#153744">Arquitetura multimodal</text><text x="42" y="149" font-size="18" font-family="Arial,sans-serif" fill="#527079">Do comportamento às hipóteses mecanísticas</text><path d="M42 178 H678" stroke="#c5d9d3" stroke-width="2"/><rect x="42" y="210" width="636" height="116" rx="18" fill="white" stroke="#d5e4df" filter="url(#shadow)"/><rect x="42" y="210" width="11" height="116" rx="5" fill="#146d66"/><circle cx="95" cy="266" r="29" fill="#146d66"/><text x="95" y="273" font-size="21" font-family="Arial" font-weight="700" text-anchor="middle" fill="white">01</text><text x="145" y="254" font-size="22" font-family="Georgia,serif" font-weight="700" fill="#153744">01 | Fenótipo</text><text x="145" y="282" font-size="17" fill="#4c676a" font-family="Arial,sans-serif">Decisão, precisão, velocidade de resposta</text><path d="M360 327 V349 m-7 -8 7 8 7 -8" stroke="#bb9852" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="42" y="350" width="636" height="116" rx="18" fill="white" stroke="#d5e4df" filter="url(#shadow)"/><rect x="42