 fill="#193f4c"/><text x="64" y="798" font-size="15" letter-spacing="1.2" font-family="Arial" font-weight="700" fill="#e6cb90">INTERPRETAÇÃO CIENTÍFICA</text><text x="64" y="828" font-size="16" font-family="Arial,sans-serif" fill="#eef7f3">Níveis complementares de observação não representam,</text><text x="64" y="850" font-size="16" font-family="Arial,sans-serif" fill="#eef7f3">isoladamente, uma cadeia causal.</text><text x="42" y="921" font-size="14" fill="#557078" font-family="Arial,sans-serif">Lu et al., 2026 · Owens &amp; Bennett, 2024</text></svg>